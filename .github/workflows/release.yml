# 태그 v* 푸시(또는 수동 실행) 때 Windows 설치 파일을 빌드해 GitHub Release에 올린다.
# 고정 이름 wy-note-setup.exe도 함께 올려 releases/latest/download/wy-note-setup.exe가 늘 최신을 가리키게 한다.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Rust 준비
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: 버전·태그 확인
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            Write-Error "태그 $env:GITHUB_REF_NAME 와 tauri.conf.json 버전 $version 이 다릅니다."
            exit 1
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            # 수동 실행이 이미 나간 릴리스의 파일을 다른 커밋 빌드로 덮어쓰지 않게 한다(태그 재실행만 덮어씀). 빌드 전에 막는다.
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Error "$tag 릴리스가 이미 있습니다. 버전을 올리거나 태그 푸시로 다시 실행하세요."
              exit 1
            }
            $global:LASTEXITCODE = 0
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - run: npm ci

      - name: 설치 파일 빌드(NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Release에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $src = "src-tauri/target/release/bundle/nsis/wy-note_${env:VERSION}_x64-setup.exe"
          if (-not (Test-Path $src)) { Write-Error "설치 파일이 없습니다: $src"; exit 1 }
          $fixed = Join-Path $env:RUNNER_TEMP 'wy-note-setup.exe'
          Copy-Item $src $fixed

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target $env:GITHUB_SHA --title "wy-note $env:VERSION" --generate-notes --latest
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $env:TAG $src $fixed --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
